name: Build desktop installers

# Produces self-contained Windows (.exe) and macOS (.dmg) installers with
# jpackage. Both bundle the full JRE, so the end user needs no extra runtime
# and no network access to run Librora.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  APP_NAME: Librora
  MAIN_CLASS: com.library.bootstrap.LibraryApplication

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install WiX 3 (jpackage bundler for .exe)
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (Test-Path $wix) {
            "WIX_HOME=C:\Program Files (x86)\WiX Toolset v3.14" | Out-File -FilePath $env:GITHUB_ENV -Append
            Add-Content -Path $env:GITHUB_PATH -Value $wix
          }

      - name: Build shaded JAR
        run: mvn -B install -DskipTests

      - name: Create app.ico (256x256, centred square crop of the 1448x1086 source)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $src = [System.Drawing.Image]::FromFile((Resolve-Path 'bootstrap/src/main/resources/icon.png'))
          $size = 256
          $side = [Math]::Min($src.Width, $src.Height)
          $bmp = New-Object System.Drawing.Bitmap $size, $size
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.InterpolationMode = 'HighQualityBicubic'
          $g.Clear([System.Drawing.Color]::Transparent)
          $g.DrawImage($src, (New-Object System.Drawing.Rectangle 0,0,$size,$size),
                       (New-Object System.Drawing.Rectangle (($src.Width-$side)/2), (($src.Height-$side)/2), $side, $side),
                       'Pixel')
          $g.Dispose()
          New-Item -ItemType Directory -Force -Path build-ico | Out-Null
          $ico = [System.Drawing.Icon]::FromImage($bmp)
          $fs = [System.IO.File]::Create((Join-Path (Get-Location) 'build-ico\app.ico'))
          $ico.Save($fs)
          $fs.Close(); $ico.Dispose(); $bmp.Dispose(); $src.Dispose()

      - name: Package .exe installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pom.xml -Pattern '<version>([^<]+)</version>' |
                      Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path jpkg-input | Out-Null
          Copy-Item "bootstrap/target/bootstrap-$version.jar" "jpkg-input/bootstrap-$version.jar"
          jpackage --type exe `
            --name $env:APP_NAME `
            --app-version $version `
            --input jpkg-input `
            --main-jar "bootstrap-$version.jar" `
            --main-class $env:MAIN_CLASS `
            --icon build-ico/app.ico `
            --java-options "-Xms256m -Xmx1024m" `
            --vendor "Librora" `
            --dest dist
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: Librora-windows-installer
          path: dist/*.exe
          if-no-files-found: error

  macos:
    name: macOS (.dmg, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: aarch64
          - runner: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build shaded JAR
        run: mvn -B install -DskipTests

      - name: Create Librora.icns from the PNG source
        run: |
          set -euo pipefail
          mkdir -p Librora.iconset
          sips -Z 1024 bootstrap/src/main/resources/icon.png --out /tmp/icon.png >/dev/null
          # Centre-crop to a square, then emit the iconset sizes macOS expects.
          sips -c 1024 1024 /tmp/icon.png --out /tmp/icon-square.png >/dev/null
          for size in 16 32 64 128 256 512; do
            sips -z $size $size /tmp/icon-square.png \
                 --out "Librora.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z $double $double /tmp/icon-square.png \
                 --out "Librora.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns Librora.iconset -o Librora.icns
          ls -la Librora.icns

      - name: Package .dmg
        run: |
          set -euo pipefail
          version=$(python3 -c 'import re;print(re.search(r"<version>([^<]+)</version>", open("pom.xml").read()).group(1))')
          mkdir -p jpkg-input
          cp "bootstrap/target/bootstrap-${version}.jar" "jpkg-input/bootstrap-${version}.jar"
          jpackage --type dmg \
            --name Librora \
            --app-version "$version" \
            --input jpkg-input \
            --main-jar "bootstrap-${version}.jar" \
            --main-class com.library.bootstrap.LibraryApplication \
            --icon Librora.icns \
            --java-options "-Xms256m -Xmx1024m" \
            --vendor Librora \
            --dest dist
          # Ad-hoc signature so Gatekeeper lets the user approve it once.
          if [ -d "dist/Librora.app" ]; then
            codesign --force --deep --sign - "dist/Librora.app" || true
          fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Librora-macos-installer-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
