<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Librora — Iniciando</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="icon" href="/img/librora-logo.png" type="image/png">
    <style nonce="">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0d11;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f1f2f6;
        }
        .loading-container {
            text-align: center;
            padding: 3rem;
        }
        .loading-container img {
            height: 80px;
            width: auto;
            margin-bottom: 1.5rem;
        }
        .loading-container h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #f1f2f6;
        }
        .loading-container p {
            color: #8b8f98;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #2a2d35;
            border-top: 3px solid #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-bar {
            width: 200px;
            height: 4px;
            background: #2a2d35;
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: #4a9eff;
            border-radius: 2px;
            animation: progress 1.5s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0%; margin-left: 0; }
            50% { width: 80%; margin-left: 10%; }
            100% { width: 0%; margin-left: 100%; }
        }
        .fallback-link {
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }
        .fallback-link a {
            color: #4a9eff;
            text-decoration: none;
        }
        .fallback-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <img src="/img/librora-logo.png" alt="Librora">
        <h2>Iniciando Librora</h2>
        <p>Preparando el sistema, por favor espera...</p>
        <div class="spinner"></div>
        <div class="progress-bar">
            <div class="progress-bar-fill"></div>
        </div>
        <div class="fallback-link">
            Si no eres redirigido automáticamente, <a href="/login">haz clic aquí</a>
        </div>
    </div>
    <script nonce="">
        (function() {
            var maxAttempts = 60;
            var attempt = 0;
            function checkReady() {
                attempt++;
                var xhr = new XMLHttpRequest();
                xhr.timeout = 3000;
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4) {
                        if (xhr.status === 200) {
                            window.location.href = '/login';
                        } else if (attempt >= maxAttempts) {
                            window.location.href = '/login';
                        } else {
                            setTimeout(checkReady, 1000);
                        }
                    }
                };
                xhr.onerror = function() {
                    if (attempt >= maxAttempts) {
                        window.location.href = '/login';
                    } else {
                        setTimeout(checkReady, 1000);
                    }
                };
                xhr.open('GET', '/api/health', true);
                xhr.send();
            }
            setTimeout(checkReady, 500);
        })();
    </script>
</body>
</html>
