<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation Confirmed - Library</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .success-container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        .success-icon {
            font-size: 5rem;
            color: #34d399;
            margin-bottom: 1.5rem;
        }
        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1rem;
        }
        .success-message {
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            color: #fff;
            transform: translateY(-2px);
        }
        .info-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            text-align: left;
        }
        .info-box p { color: #93c5fd; margin-bottom: 0.5rem; }
        .info-box p:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="success-container">
        <i class="bi bi-check-circle-fill success-icon"></i>
        <h1 class="success-title">Reservation Confirmed!</h1>
        <p class="success-message">Your reservation has been successfully created.</p>

        <div class="info-box">
            <p><i class="bi bi-info-circle"></i> <strong>Next steps:</strong></p>
            <p><i class="bi bi-1-circle"></i> Visit the library within 3 days to pick up your book</p>
            <p><i class="bi bi-2-circle"></i> Bring your DNI for identification</p>
            <p><i class="bi bi-3-circle"></i> Pay the deposit (50%) when you pick up</p>
        </div>

        <a href="/catalog" class="btn-back"><i class="bi bi-arrow-left"></i> Back to Catalog</a>
    </div>
</body>
</html>
